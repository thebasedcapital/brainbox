<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 520" width="1280" height="520" role="img" aria-labelledby="immune-t">
<title id="immune-t">Error to fix memory: a failing test, the edits that fixed it, recalled the next time</title>
<style>
@font-face{font-family:"BB Gaegu";src:url(data:font/woff2;base64,) format("woff2");font-weight:300;}
.hand{font-family:"BB Gaegu","Comic Sans MS",cursive;font-weight:300;}
.sans{font-family:"BB DM Sans",Arial,sans-serif;}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}
.draw{stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1500ms cubic-bezier(0.23, 1, 0.32, 1) forwards;}
.fade{animation:fade 900ms cubic-bezier(0.23, 1, 0.32, 1) both;}
.pop{transform-box:fill-box;transform-origin:center;animation:pop 700ms cubic-bezier(0.23, 1, 0.32, 1) both;}
@keyframes draw{to{stroke-dashoffset:0;}}
@keyframes fade{from{opacity:0;}}
@keyframes pop{from{opacity:0;transform:scale(0.2);}}
.breathe{transform-box:fill-box;transform-origin:center;animation:pop 700ms cubic-bezier(0.23, 1, 0.32, 1) both,breathe 3.2s ease-in-out 1.6s infinite;}
@keyframes breathe{50%{transform:scale(1.35);}}
.grow{transform-box:fill-box;transform-origin:50% 100%;animation:grow 1300ms cubic-bezier(0.23, 1, 0.32, 1) both;}
@keyframes grow{from{transform:scaleY(0);}}
@media (prefers-reduced-motion:reduce){.draw,.fade,.pop,.breathe,.grow{animation:none;stroke-dashoffset:0;}}
</style>
<rect width="1280" height="520" rx="18" fill="#f6f1e4"/>
