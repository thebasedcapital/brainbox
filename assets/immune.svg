ass="mono fade" font-size="15" fill="#2a2620" text-anchor="start" style="animation-delay:1400ms">edit  src/api/token.ts</text><text x="476" y="320" class="mono fade" font-size="15" fill="#2a2620" text-anchor="start" style="animation-delay:1600ms"><tspan fill="#6d665a">$</tspan> npm test</text><text x="588" y="320" class="mono fade" font-size="15" fill="#526c50" text-anchor="start" style="animation-delay:1750ms">✓ passing</text><path d="M478 342C497.7 343 558 348.3 596 348C634 347.7 687.7 341.3 706 340" pathLength="1" class="draw" fill="none" stroke="#526c50" stroke-width="1.4" style="animation-delay:1800ms"/><path d="M422 282C424.3 280 428.7 272.3 436 270C443.3 267.7 461 268.3 466 268" pathLength="1" class="draw" fill="none" stroke="#8a8848" stroke-width="1.3" style="animation-delay:900ms"/><path d="M458.3 264.1L466 268L458.2 272" pathLength="1" class="draw" fill="none" stroke="#8a8848" stroke-width="1.3" style="animation-delay:1200ms"/><text x="836" y="190" class="hand fade" font-size="24" fill="#6d665a" text-anchor="start" style="animation-delay:2000ms">stored as a procedure</text><rect x="836" y="208" width="390" height="150" rx="10" class="fade" fill="#ece5d4" stroke="#dcd4c2" stroke-width="1" style="animation-delay:2100ms"/><text x="856" y="242" class="mono fade" font-size="14" fill="#b83e2d" text-anchor="start" style="animation-delay:2200ms">error_fix</text><text x="946" y="242" class="mono fade" font-size="14" fill="#2a2620" text-anchor="start" style="animation-delay:2200ms">TYPE_ERROR|property_access</text><text x="856" y="274" class="mono fade" font-size="14" fill="#6d665a" text-anchor="start" style="animation-delay:2300ms">edit session.ts → edit token.ts</text><text x="856" y="296" class="mono fade" font-size="14" fill="#6d665a" text-anchor="start" style="animation-delay:2350ms">→ npm test</text><text x="856" y="332" class="mono fade" font-size="14" fill="#526c50" text-anchor="start" style="animation-delay:2450ms">+3 helpful · −0 harmful</text><path d="M726 282C737.7 282.7 779.3 286 796 286C812.7 286 821 282.7 826 282" pathLength="1" class="draw" fill="none" stroke="#8a8848" stroke-width="1.3" style="animation-delay:1900ms"/><path d="M818.3 278.5L826 282L817.4 285.8" pathLength="1" class="draw" fill="none" stroke="#8a8848" stroke-width="1.3" style="animation-delay:2200ms"/><text x="56" y="440" class="hand fade" font-size="24" fill="#6d665a" text-anchor="start" style="animation-delay:2800ms">the next time</text><text x="206" y="440" class="mono fade" font-size="15" fill="#b83e2d" text-anchor="start" style="animation-delay:2900ms">TypeError … (reading 'token')</text><path d="M486 435C492.7 433.8 513.3 428.2 526 428C538.7 427.8 556 433 562 434" pathLength="1" class="draw" fill="none" stroke="#8a8848" stroke-width="1.3" style="animation-delay:3000ms"/><path d="M554.6 428.7L562 434L553.3 436.2" pathLength="1" class="draw" fill="none" stroke="#8a8848" stroke-width="1.3" style="animation-delay:3200ms"/><text x="592" y="440" class="mono fade" font-size="15" fill="#2a2620" text-anchor="start" style="animation-delay:3200ms">session.ts  token.ts</text><path d="M777.3 424.6C779.1 425.9 786.5 429.6 788.3 432.2C790.1 434.8 790.5 437.5 788.2 440.2C785.9 442.8 781.5 445.6 774.5 447.9C767.4 450.1 757.1 452.4 745.9 453.9C734.7 455.4 720.6 456.6 707.3 457.1C694 457.6 679.4 457.4 666 457C652.7 456.6 639 455.7 627.3 454.4C615.5 453.1 603.8 451.3 595.8 449.2C587.8 447.1 583.8 444.4 579.1 441.8C574.3 439.3 567.6 436.5 567.5 433.9C567.4 431.2 572.7 428.3 578.4 425.8C584.1 423.3 592.4 420.9 602 418.9C611.5 416.9 623.2 415.1 635.7 413.9C648.2 412.7 663.2 411.7 676.8 411.7C690.5 411.7 704.9 412.8 717.6 413.8C730.4 414.9 747.4 417.2 753.4 417.8" pathLength="1" class="draw" fill="none" stroke="#b83e2d" stroke-width="1.4" style="animation-delay:3400ms"/><text x="808" y="440" class="hand fade" font-size="23" fill="#2a2620" text-anchor="start" style="animation-delay:3500ms">recalled before any search</text><text x="56" y="494" class="hand fade" font-size="19" fill="#6d665a" text-anchor="start" style="animation-delay:3600ms">fig. 6 — procedures are shown to the agent as quoted observations from past sessions, never as instructions.</text>
